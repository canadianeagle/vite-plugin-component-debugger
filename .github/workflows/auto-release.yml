# .github/workflows/auto-release.yml
name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run linter
        run: pnpm run lint

      - name: Build package
        run: pnpm run build

      - name: Check package
        run: pnpm pack && rm -f *.tgz

  auto-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      # Fail before tagging, not after. Publishing is the LAST step, so a dead
      # NPM_TOKEN used to leave a git tag and a GitHub Release pointing at a
      # version that never reached the registry. v2.2.1 sat in that state for
      # nine months and looked shipped.
      - name: Preflight - verify npm credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is not set. Nothing would be published."
            exit 1
          fi

          if ! WHO=$(npm whoami 2>&1); then
            echo "::error::NPM_TOKEN is set but not accepted by the registry (npm said: ${WHO})."
            echo "::error::npm reports an unauthenticated publish as '404 Not Found - PUT', which is misleading."
            echo "::error::Create a new token with 'npm token create --type=automation' and update the NPM_TOKEN secret."
            exit 1
          fi
          echo "Authenticated to npm as: ${WHO}"

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Determine version bump type
        id: bump_type
        run: |
          # Get the last commit message
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"

          # Determine bump type based on commit message
          if echo "$COMMIT_MSG" | grep -iq "BREAKING CHANGE\|major:"; then
            echo "type=major" >> $GITHUB_OUTPUT
            echo "Detected MAJOR version bump"
          elif echo "$COMMIT_MSG" | grep -iq "feat:\|feature:\|minor:"; then
            echo "type=minor" >> $GITHUB_OUTPUT
            echo "Detected MINOR version bump"
          else
            echo "type=patch" >> $GITHUB_OUTPUT
            echo "Detected PATCH version bump"
          fi

      - name: Check if version already bumped
        id: check_version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")
          echo "Current version: $CURRENT_VERSION"

          # Bump if this version is already ON NPM. The registry is the source of
          # truth for "has this shipped".
          #
          # This used to test for a local git tag instead, which silently skipped
          # the bump whenever a version had no tag: the workflow would detect a
          # minor bump, ignore it, and then try to republish the current version.
          if npm view "$PKG_NAME@$CURRENT_VERSION" version >/dev/null 2>&1; then
            echo "$CURRENT_VERSION is already published, bumping"
            echo "needs_bump=true" >> $GITHUB_OUTPUT
          elif git rev-parse "v$CURRENT_VERSION" >/dev/null 2>&1; then
            echo "Tag v$CURRENT_VERSION already exists, bumping"
            echo "needs_bump=true" >> $GITHUB_OUTPUT
          else
            echo "$CURRENT_VERSION is unpublished and untagged, releasing as-is"
            echo "needs_bump=false" >> $GITHUB_OUTPUT
            echo "VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
          fi

      - name: Bump version in package.json
        if: steps.check_version.outputs.needs_bump == 'true'
        run: |
          pnpm version ${{ steps.bump_type.outputs.type }} -m "chore: release v%s [skip ci]"
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "Bumped to version $NEW_VERSION"

      - name: Push version bump commit
        if: steps.check_version.outputs.needs_bump == 'true'
        run: |
          git push origin main

      - name: Create and push tag
        run: |
          git tag v${{ env.VERSION }}
          git push origin v${{ env.VERSION }}
          echo "Created and pushed tag v${{ env.VERSION }}"

      - name: Generate changelog and update file
        run: |
          # Install changelog generator
          npm install -g auto-changelog

          # Generate changelog content using the custom template
          auto-changelog --stdout --commit-limit false -u --template ".github/changelog-template.hbs" --starting-version ${{ env.VERSION }} --issue-url "https://github.com/canadianeagle/vite-plugin-component-debugger/issues/{id}" > new-changelog-entry.md

          # Prepare the new changelog entry
          # The output from auto-changelog includes the version header, so we can use it directly

          # Read the existing changelog
          EXISTING_CHANGELOG=$(cat changelog.md)

          # Create the new changelog content
          # The header is already in new-changelog-entry.md
          # We need to remove the old header from the existing changelog
          # This is a simple way to do it, might need adjustment based on your changelog format
          UPDATED_CHANGELOG=$(echo -e "$(cat new-changelog-entry.md)\n\n$(echo "$EXISTING_CHANGELOG" | sed '1,7d')")

          # Write the updated changelog
          echo "$UPDATED_CHANGELOG" > changelog.md

          # Also create release notes for the GitHub Release
          cp changelog.md release-notes.md

          # Commit the updated changelog
          git add changelog.md
          git commit -m "chore: update changelog for v${{ env.VERSION }} [skip ci]"
          git push origin main

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION }}
          release_name: v${{ env.VERSION }}
          body_path: release-notes.md
          draft: false
          prerelease: false

      - name: Publish to NPM
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Trust the registry, not the exit code.
      - name: Verify the version is actually on npm
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          for attempt in 1 2 3 4 5; do
            if npm view "${PKG_NAME}@${{ env.VERSION }}" version >/dev/null 2>&1; then
              echo "Confirmed ${PKG_NAME}@${{ env.VERSION }} is live on npm"
              exit 0
            fi
            echo "Not visible yet (attempt ${attempt}/5), waiting for registry propagation..."
            sleep 10
          done
          echo "::error::${PKG_NAME}@${{ env.VERSION }} is not on the registry after publishing."
          exit 1

      - name: Success notification
        run: |
          echo "🎉 Successfully released v${{ env.VERSION }}"
          echo "📦 NPM: https://www.npmjs.com/package/vite-plugin-component-debugger"
          echo "🏷️ GitHub: ${{ steps.create_release.outputs.html_url }}"
